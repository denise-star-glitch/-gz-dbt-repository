version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:

      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez
        columns:
          - name: date_date
            description: date of purchase

          - name: orders_id
            description: foreign key to ship

          - name: pdt_id
            description: foreign key to product

          - name: revenue
            description: amount paid by customer

          - name: quantity
            description: quantity of products purchased

        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - orders_id
                  - pdt_id

      - name: product
        identifier: raw_gz_product
        description: products of Greenweez
        columns:
          - name: products_id
            description: Primary key
            tests:
              - unique
              - not_null

          - name: purchase_price
            description: purchase price of product

      - name: ship
        identifier: raw_gz_ship
        description: shipping data for Greenweez orders
        columns:
          - name: orders_id
            description: Primary key
            tests:
              - unique
              - not_null

          - name: shipping_fee
            description: shipping fee

          - name: log_cost
            description: preparation cost

          - name: ship_cost
            description: shipping cost

      - name: adwords
        identifier: raw_gz_adwords
      - name: bing
        identifier: raw_gz_bing
      - name: criteo
        identifier: raw_gz_criteo
      - name: facebook
        identifier: raw_gz_facebook